<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🚀 تیراندازی فضایی</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#04060f;
            font-family:system-ui,sans-serif;direction:rtl}
  canvas{display:block;position:fixed;inset:0;touch-action:none}
  
  #tabs{position:fixed;top:0;left:0;right:0;height:50px;
    background:rgba(4,6,15,.85);
    border-bottom:1px solid rgba(0,255,255,.15);
    display:flex;z-index:10;backdrop-filter:blur(6px)}
  .tab{flex:1;background:transparent;border:none;
    color:#5a7d8f;font-size:14px;font-weight:600;
    cursor:pointer;transition:.2s;font-family:inherit}
  .tab.active{color:#7df9ff;box-shadow:inset 0 -2px 0 #0ff}
  .tab:active{background:rgba(0,255,255,.05)}

  .panel{position:fixed;top:50px;left:0;right:0;bottom:0;
    background:#04060f;color:#7df9ff;
    padding:20px;overflow-y:auto;display:none;z-index:5}
  .panel.show{display:block}
  .panel h2{text-align:center;font-size:22px;margin-bottom:20px;
    text-shadow:0 0 15px rgba(0,255,255,.5)}

  #rankList{list-style:none;max-width:400px;margin:0 auto}
  #rankList li{display:flex;align-items:center;
    padding:12px 18px;margin-bottom:10px;
    background:rgba(0,255,255,.05);
    border:1px solid rgba(0,255,255,.2);
    border-radius:12px;font-size:16px}
  #rankList li.empty{justify-content:center;color:#5a7d8f;font-size:15px}
  #rankList .pos{width:28px;height:28px;border-radius:50%;
    background:rgba(0,255,255,.1);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;margin-left:10px;color:#7df9ff;font-size:14px}
  #rankList li:nth-child(1) .pos{background:gold;color:#04060f}
  #rankList li:nth-child(2) .pos{background:#c0c0c0;color:#04060f}
  #rankList li:nth-child(3) .pos{background:#cd7f32;color:#04060f}
  #rankList .avatar{font-size:20px;margin-right:10px}
  #rankList .name{color:#aaa;font-size:14px;margin-right:10px;width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #rankList .sc{flex:1;font-size:18px;font-weight:700;color:#fff;text-align:left}

  .form-group{margin-bottom:20px;max-width:400px;margin-left:auto;margin-right:auto}
  .form-group label{display:block;margin-bottom:8px;color:#aaa}
  .form-group input{width:100%;padding:12px;border-radius:8px;
    background:rgba(255,255,255,.05);border:1px solid rgba(0,255,255,.3);
    color:#fff;font-family:inherit;font-size:16px;outline:none}
  .form-group input:focus{border-color:#0ff}
  .emoji-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(50px, 1fr));gap:10px}
  .emoji-btn{font-size:24px;background:rgba(255,255,255,.05);border:2px solid transparent;
    border-radius:10px;padding:10px;cursor:pointer;transition:.2s;text-align:center}
  .emoji-btn.selected{border-color:#0ff;background:rgba(0,255,255,.15);transform:scale(1.1)}
  .save-btn{display:block;width:100%;max-width:400px;margin:20px auto;padding:14px;
    background:#0ff;color:#04060f;border:none;border-radius:10px;
    font-size:18px;font-weight:bold;cursor:pointer;font-family:inherit}

  .shop-header{text-align:center;margin-bottom:15px;font-size:18px;color:#ffd700;font-weight:bold}
  .shop-list{display:flex;flex-direction:column;gap:12px;max-width:500px;margin:0 auto}
  .weapon-card{display:flex;align-items:center;justify-content:space-between;
    background:rgba(255,255,255,.03);border:1px solid rgba(0,255,255,.2);
    padding:15px;border-radius:12px;transition:.2s}
  .weapon-card.owned{border-color:rgba(0,255,0,.4);background:rgba(0,255,0,.05)}
  .weapon-card.equipped{border-color:#0ff;box-shadow:0 0 10px rgba(0,255,255,.3)}
  .w-info h3{font-size:16px;margin-bottom:5px;color:#fff}
  .w-info p{font-size:13px;color:#888}
  .w-action{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .w-price{font-size:15px;font-weight:bold;color:#ffd700}
  .w-btn{padding:8px 16px;border-radius:20px;border:none;cursor:pointer;
    font-family:inherit;font-weight:bold;font-size:14px;transition:.2s}
  .btn-buy{background:#ffd700;color:#000}
  .btn-buy:disabled{background:#555;color:#888;cursor:not-allowed}
  .btn-equip{background:transparent;border:1px solid #0ff;color:#0ff}
  .btn-equipped{background:#0ff;color:#000;border:1px solid #0ff}

  #gameOver{position:fixed;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:15px;
    background:rgba(4,6,15,.9);color:#fff;text-align:center;
    z-index:20;backdrop-filter:blur(5px)}
  #gameOver h1{font-size:36px;color:#ff5c8a;text-shadow:0 0 20px #ff5c8a}
  #gameOver p{font-size:20px;color:#7df9ff}
  #gameOver .final-score{font-size:28px;font-weight:bold;color:#fff;margin:10px 0}
  #restartBtn{margin-top:20px;padding:14px 40px;font-size:20px;
    border:2px solid #0ff;background:transparent;color:#0ff;
    border-radius:40px;cursor:pointer;font-family:inherit}
  #restartBtn:active{background:#0ff;color:#04060f}
</style>
</head>
<body>
<div id="tabs">
  <button class="tab active" data-tab="game">🎮 بازی</button>
  <button class="tab" data-tab="shop">🛒 فروشگاه</button>
  <button class="tab" data-tab="rank">🏆 رتبه‌ها</button>
  <button class="tab" data-tab="profile">👤 پروفایل</button>
</div>

<canvas id="c"></canvas>

<div id="shopPanel" class="panel">
  <h2>🛒 فروشگاه سلاح</h2>
  <div class="shop-header">💰 موجودی شما: <span id="shopCoins">0</span> سکه</div>
  <div class="shop-list" id="shopList"></div>
</div>

<div id="rankPanel" class="panel">
  <h2>🏆 رتبه‌بندی آنلاین</h2>
  <ol id="rankList"></ol>
</div>

<div id="profilePanel" class="panel">
  <h2>👤 پروفایل شما</h2>
  <div class="form-group">
    <label>اسم شما:</label>
    <input type="text" id="nameInput" maxlength="12" placeholder="اسمت رو بنویس...">
  </div>
  <div class="form-group">
    <label>انتخاب آواتار (ایموجی):</label>
    <div class="emoji-grid" id="emojiGrid"></div>
  </div>
  <button class="save-btn" id="saveProfileBtn">ذخیره پروفایل</button>
</div>

<div id="gameOver">
  <h1>💥 بازی تموم شد!</h1>
  <p>جونات تموم شد...</p>
  <div class="final-score">امتیاز نهایی: <span id="finalScoreVal">0</span></div>
  <button id="restartBtn">دوباره بازی کن</button>
</div>

<script>
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { alpha: false });
let W, H;

const PANTRY_URL = "https://getpantry.cloud/apiv1/pantry/151e51ac-1424-4786-9386-be9f3b059221/basket/scores";

const WEAPONS = [
  { id: 1, name: "لیزر ساده", cost: 0, color: "#dfffff", dmg: 1, cd: 80, size: 4, count: 1, spread: 0 },
  { id: 2, name: "شلیک دوقلو", cost: 50, color: "#00ffcc", dmg: 1, cd: 80, size: 4, count: 2, spread: 10 },
  { id: 3, name: "لیزر سرخ", cost: 150, color: "#ff3333", dmg: 2, cd: 60, size: 6, count: 1, spread: 0 },
  { id: 4, name: "سه‌گانه", cost: 300, color: "#ffff00", dmg: 1, cd: 75, size: 5, count: 3, spread: 15 },
  { id: 5, name: "پلاسما", cost: 600, color: "#ff00ff", dmg: 4, cd: 100, size: 10, count: 1, spread: 0 },
  { id: 6, name: "چهارگانه", cost: 1000, color: "#00ff00", dmg: 2, cd: 70, size: 5, count: 4, spread: 20 },
  { id: 7, name: "مسلسل نئونی", cost: 1800, color: "#00ccff", dmg: 1, cd: 25, size: 4, count: 1, spread: 5 },
  { id: 8, name: "شاتگان فضایی", cost: 3000, color: "#ff8800", dmg: 3, cd: 90, size: 6, count: 5, spread: 35 },
  { id: 9, name: "ریل‌گان", cost: 5000, color: "#ffffff", dmg: 12, cd: 150, size: 8, count: 1, spread: 0 },
  { id: 10, name: "ابرنواختر", cost: 8000, color: "#ff00aa", dmg: 5, cd: 80, size: 8, count: 7, spread: 45 },
];

let profile = { name: 'بازیکن ناشناس', avatar: '👾' };
let coins = parseInt(localStorage.getItem('shooter_coins') || '0');
let ownedWeapons = JSON.parse(localStorage.getItem('shooter_weapons') || '[1]');
let equippedWeapon = parseInt(localStorage.getItem('shooter_equipped') || '1');

try {
  const savedProf = localStorage.getItem('shooter_profile');
  if(savedProf) profile = JSON.parse(savedProf);
} catch(e) {}

function saveData() {
  localStorage.setItem('shooter_coins', coins);
  localStorage.setItem('shooter_weapons', JSON.stringify(ownedWeapons));
  localStorage.setItem('shooter_equipped', equippedWeapon);
}

const emojis = ['👾', '🚀', '👽', '🐱', '🐶', '🦊', '🐼', '🦁', '🐸', '🤖', '🦄', '👻', '💩', '🐉', '🦅', '🐺'];
let selectedEmoji = profile.avatar;

function renderProfileUI() {
  document.getElementById('nameInput').value = profile.name;
  const grid = document.getElementById('emojiGrid');
  grid.innerHTML = emojis.map(e => 
    '<div class="emoji-btn ' + (e === selectedEmoji ? 'selected' : '') + '" onclick="selectEmoji(\'' + e + '\')">' + e + '</div>'
  ).join('');
}

window.selectEmoji = (e) => {
  selectedEmoji = e;
  renderProfileUI();
};

document.getElementById('saveProfileBtn').onclick = () => {
  const newName = document.getElementById('nameInput').value.trim() || 'بازیکن ناشناس';
  profile = { name: newName, avatar: selectedEmoji };
  localStorage.setItem('shooter_profile', JSON.stringify(profile));
  alert('پروفایل با موفقیت ذخیره شد! 🎉');
  document.querySelector('.tab[data-tab="game"]').click();
};

renderProfileUI();

function renderShop() {
  document.getElementById('shopCoins').textContent = coins;
  const list = document.getElementById('shopList');
  list.innerHTML = WEAPONS.map(w => {
    const isOwned = ownedWeapons.includes(w.id);
    const isEquipped = equippedWeapon === w.id;
    let actionHtml = '';
    
    if (isEquipped) {
      actionHtml = '<button class="w-btn btn-equipped">مجهز شده</button>';
    } else if (isOwned) {
      actionHtml = '<button class="w-btn btn-equip" onclick="equipWeapon(' + w.id + ')">مجهز کردن</button>';
    } else {
      const canAfford = coins >= w.cost;
      actionHtml = '<button class="w-btn btn-buy" ' + (!canAfford ? 'disabled' : '') + ' onclick="buyWeapon(' + w.id + ')">خرید</button>';
    }

    return '<div class="weapon-card ' + (isOwned ? 'owned' : '') + ' ' + (isEquipped ? 'equipped' : '') + '">' +
      '<div class="w-info">' +
        '<h3>' + w.name + '</h3>' +
        '<p>دمیج: ' + w.dmg + ' | تعداد تیر: ' + w.count + '</p>' +
      '</div>' +
      '<div class="w-action">' +
        (isOwned ? '' : '<div class="w-price">💰 ' + w.cost + '</div>') +
        actionHtml +
      '</div>' +
    '</div>';
  }).join('');
}

window.buyWeapon = (id) => {
  const w = WEAPONS.find(x => x.id === id);
  if (coins >= w.cost && !ownedWeapons.includes(id)) {
    coins -= w.cost;
    ownedWeapons.push(id);
    equippedWeapon = id;
    saveData();
    renderShop();
    alert('سلاح "' + w.name + '" با موفقیت خریداری و مجهز شد! 🎉');
  }
};

window.equipWeapon = (id) => {
  if (ownedWeapons.includes(id)) {
    equippedWeapon = id;
    saveData();
    renderShop();
  }
};

function resize(){
  W = innerWidth; H = innerHeight;
  cvs.width = W; cvs.height = H;
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
}
resize();
addEventListener('resize', () => {
  resize();
  if(S){ S.player.y = H - 90; S.player.x = Math.min(S.player.x, W - 22); }
});

let S, lastSaved = 0, isDead = false;

function reset(){
  let savedScore = parseInt(localStorage.getItem('shooter_current_score') || '0');
  if(isDead) {
    savedScore = 0;
    localStorage.setItem('shooter_current_score', 0);
    isDead = false;
  }
  
  S = {
    player: {x: W/2, y: H - 90, r: 15},
    bullets: [], enemies: [], parts: [], stars: [],
    score: savedScore, lives: 3, cool: 0, spawnT: 0, shake: 0, t: 0,
  };
  lastSaved = savedScore;
  document.getElementById('gameOver').style.display = 'none';

  for(let i = 0; i < 40; i++){
    S.stars.push({
      x: Math.random()*W, y: Math.random()*H,
      z: Math.random()*0.8 + 0.2,
    });
  }
}
reset();

const keys = {left:false, right:false, fire:false};
let touching = false, touchX = null;

addEventListener('keydown', e => {
  if(['ArrowLeft','a','A'].includes(e.key)) keys.left = true;
  if(['ArrowRight','d','D'].includes(e.key)) keys.right = true;
  if(e.key === ' '){ keys.fire = true; e.preventDefault(); }
});
addEventListener('keyup', e => {
  if(['ArrowLeft','a','A'].includes(e.key)) keys.left = false;
  if(['ArrowRight','d','D'].includes(e.key)) keys.right = false;
  if(e.key === ' ') keys.fire = false;
});

cvs.addEventListener('touchstart', e => {
  e.preventDefault(); touching = true;
  const t = e.touches[0];
  if(t) touchX = t.clientX;
}, {passive:false});
cvs.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  if(t) touchX = t.clientX;
}, {passive:false});
cvs.addEventListener('touchend', e => {
  e.preventDefault(); touching = false; touchX = null;
}, {passive:false});

cvs.addEventListener('mousedown', () => { keys.fire = true; });
addEventListener('mouseup', () => keys.fire = false);
cvs.addEventListener('mousemove', e => { if(keys.fire) touchX = e.clientX; });

function fire(){
  const w = WEAPONS.find(x => x.id === equippedWeapon);
  S.cool = w.cd;
  
  for(let i = 0; i < w.count; i++){
    let angle = 0;
    if(w.count > 1){
      const spreadRad = (w.spread * Math.PI) / 180;
      angle = -spreadRad/2 + (spreadRad / (w.count - 1)) * i;
    }
    
    const speed = 1.6;
    const vx = Math.sin(angle) * speed;
    const vy = -Math.cos(angle) * speed;
    
    S.bullets.push({
      x: S.player.x, 
      y: S.player.y - 22, 
      vx: vx, 
      vy: vy, 
      dmg: w.dmg, 
      color: w.color, 
      size: w.size
    });
  }
}

function spawnEnemy(){
  const r = 11 + Math.random()*9;
  const diff = Math.min(S.score / 400, 1);
  S.enemies.push({
    x: 30 + Math.random()*(W - 60),
    y: -30, r,
    vy: 0.16 + Math.random()*0.10 + diff*0.15,
    vx: (Math.random() - 0.5) * 0.12,
    hue: 330 + Math.random()*50,
    rot: Math.random()*6.28,
    rv: (Math.random() - 0.5) * 0.005,
    hp: r > 17 ? 3 : 2,
  });
}

function boom(x, y, hue, n){
  for(let i = 0; i < n; i++){
    const a = Math.random()*6.28, s = Math.random()*0.45 + 0.05;
    S.parts.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 1, hue, r: Math.random()*2.5 + 1,
    });
  }
}

function update(dt){
  if(S.lives <= 0) return;

  S.t++;
  localStorage.setItem('shooter_current_score', S.score);

  for(const s of S.stars){
    s.y += s.z * dt * 0.12;
    if(s.y > H){ s.y = 0; s.x = Math.random()*W; }
  }
  const p = S.player;
  const sp = 0.9 * dt;
  if(keys.left)  p.x -= sp;
  if(keys.right) p.x += sp;
  if(touchX !== null){
    const d = touchX - p.x;
    p.x += Math.max(-sp*1.6, Math.min(sp*1.6, d));
  }
  p.x = Math.max(22, Math.min(W - 22, p.x));

  S.cool -= dt;
  if((keys.fire || touching) && S.cool <= 0) fire();
  
  for(const b of S.bullets) {
    b.x += b.vx * dt; 
    b.y += b.vy * dt;
  }

  S.spawnT -= dt;
  const interval = Math.max(280, 820 - S.score * 1.2);
  if(S.spawnT <= 0){ spawnEnemy(); S.spawnT = interval; }

  for(const e of S.enemies){
    e.y += e.vy * dt;
    e.x += e.vx * dt;
    e.rot += e.rv * dt;
    if(e.x < e.r || e.x > W - e.r) e.vx *= -1;
  }

  for(let i = S.bullets.length - 1; i >= 0; i--){
    const b = S.bullets[i];
    for(let j = S.enemies.length - 1; j >= 0; j--){
      const e = S.enemies[j];
      const dx = b.x - e.x, dy = b.y - e.y;
      if(dx*dx + dy*dy < (e.r + 4)**2){
        S.bullets.splice(i, 1);
        e.hp -= b.dmg; 
        boom(b.x, b.y, 180, 3);
        if(e.hp <= 0){
          boom(e.x, e.y, e.hue, 10);
          S.enemies.splice(j, 1);
          S.score += 10;
          coins += 2; 
          saveData();
        }
        break;
      }
    }
  }

  for(let j = S.enemies.length - 1; j >= 0; j--){
    const e = S.enemies[j];
    const dx = p.x - e.x, dy = p.y - e.y;
    if(dx*dx + dy*dy < (e.r + p.r)**2){
      boom(e.x, e.y, e.hue, 12);
      S.enemies.splice(j, 1);
      S.shake = 220;
      S.lives--;
      if(S.lives <= 0) triggerGameOver();
      break;
    }
  }

  for(let j = S.enemies.length - 1; j >= 0; j--){
    if(S.enemies[j].y > H + 40){
      S.enemies.splice(j, 1);
      S.lives--;
      if(S.lives <= 0) triggerGameOver();
    }
  }

  for(let i = S.parts.length - 1; i >= 0; i--){
    const q = S.parts[i];
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vy += 0.0004 * dt;
    q.life -= dt * 0.0016;
    if(q.life <= 0) S.parts.splice(i, 1);
  }
  if(S.shake > 0) S.shake -= dt;
  S.bullets = S.bullets.filter(b => b.y > -20 && b.y < H + 20 && b.x > -20 && b.x < W + 20);
}

function triggerGameOver() {
  isDead = true;
  localStorage.setItem('shooter_current_score', 0);
  document.getElementById('finalScoreVal').textContent = S.score;
  document.getElementById('gameOver').style.display = 'flex';
  saveScore();
}

function draw(){
  const sh = S.shake > 0 ? (Math.random() - 0.5) * S.shake * 0.03 : 0;
  ctx.setTransform(1, 0, 0, 1, sh, sh);
  ctx.fillStyle = 'rgba(4,6,15,0.5)';
  ctx.fillRect(-10, -10, W + 20, H + 20);

  ctx.fillStyle = '#8fd8ff';
  for(const s of S.stars){
    ctx.globalAlpha = s.z * 0.7;
    ctx.fillRect(s.x, s.y, s.z * 1.6, s.z * 2.6);
  }
  ctx.globalAlpha = 1;

  for(const q of S.parts){
    ctx.globalAlpha = Math.max(q.life, 0);
    ctx.fillStyle = 'hsl(' + q.hue + ',100%,65%)';
    ctx.beginPath();
    ctx.arc(q.x, q.y, q.r * q.life, 0, 6.28);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for(const b of S.bullets) {
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, 6.28);
    ctx.fill();
    ctx.globalAlpha = 0.5;
    ctx.fillRect(b.x - b.size/2, b.y + b.size, b.size, 10);
    ctx.globalAlpha = 1;
  }

  for(const e of S.enemies){
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.rot);
    ctx.strokeStyle = 'hsl(' + e.hue + ',100%,70%)';
    ctx.fillStyle = 'hsla(' + e.hue + ',100%,55%,.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(let k = 0; k < 6; k++){
      const a = k / 6 * 6.283;
      const px = Math.cos(a) * e.r, py = Math.sin(a) * e.r;
      k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  if(S.lives > 0) {
    const p = S.player;
    ctx.fillStyle = '#a8ffd0';
    ctx.beginPath();
    ctx.moveTo(p.x, p.y - 20);
    ctx.lineTo(p.x - 14, p.y + 12);
    ctx.lineTo(p.x, p.y + 6);
    ctx.lineTo(p.x + 14, p.y + 12);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'hsla(' + (30 + Math.random()*20) + ',100%,65%,.85)';
    ctx.beginPath();
    ctx.moveTo(p.x - 5, p.y + 10);
    ctx.lineTo(p.x, p.y + 16 + Math.random()*10);
    ctx.lineTo(p.x + 5, p.y + 10);
    ctx.closePath();
    ctx.fill();
  }

  ctx.font = '600 16px system-ui,sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#7df9ff';
  ctx.fillText('امتیاز  ' + S.score, 18, 82);
  ctx.fillStyle = '#ffd700';
  ctx.fillText('💰 ' + coins, 18, 110);
  
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ff5c8a';
  ctx.fillText('❤️'.repeat(Math.max(0, S.lives)), W - 18, 82);
}

async function getScores(){
  try {
    const res = await fetch(PANTRY_URL);
    if(res.status === 400) return [];
    const data = await res.json();
    if(!Array.isArray(data)) return [];
    return data.sort((a,b) => b.score - a.score).slice(0, 10);
  } catch(e) {
    return [];
  }
}

async function saveScore(){
  if(S.score <= lastSaved || S.score <= 0) return;
  lastSaved = S.score;
  try {
    let scores = await getScores();
    scores.push({
      score: S.score, 
      date: Date.now(),
      name: profile.name,
      avatar: profile.avatar
    });
    scores.sort((a,b) => b.score - a.score);
    scores = scores.slice(0, 10);
    
    await fetch(PANTRY_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(scores)
    });
  } catch(e) {
    console.log("خطا در ذخیره", e);
  }
}

async function renderRank(){
  const list = document.getElementById('rankList');
  list.innerHTML = '<li class="empty">در حال دریافت رکوردها...</li>';
  
  const scores = await getScores();
  if(scores.length === 0){
    list.innerHTML = '<li class="empty">هنوز رکوردی ثبت نشده — بازی کن!</li>';
    return;
  }
  list.innerHTML = scores.map((s, i) => {
    return '<li>' +
      '<span class="pos">' + (i+1) + '</span>' +
      '<span class="avatar">' + (s.avatar || '👾') + '</span>' +
      '<span class="name">' + (s.name || 'ناشناس') + '</span>' +
      '<span class="sc">' + s.score + '</span>' +
    '</li>';
  }).join('');
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.onclick = async () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tab').forEach(b =>
      b.classList.toggle('active', b === btn));
    
    document.getElementById('shopPanel').classList.toggle('show', tab === 'shop');
    document.getElementById('rankPanel').classList.toggle('show', tab === 'rank');
    document.getElementById('profilePanel').classList.toggle('show', tab === 'profile');
    
    if(tab === 'shop') {
      renderShop();
    } else if(tab === 'rank'){
      await saveScore();
      renderRank();
    }
  };
});

document.getElementById('restartBtn').onclick = () => {
  reset();
  document.querySelector('.tab[data-tab="game"]').click();
};

let last = 0;
function loop(ts){
  const dt = last ? Math.min(ts - last, 50) : 16;
  last = ts;
  const onGame = !document.getElementById('rankPanel').classList.contains('show') && 
                 !document.getElementById('profilePanel').classList.contains('show') &&
                 !document.getElementById('shopPanel').classList.contains('show');
  if(onGame){
    update(dt);
    draw();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
