<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🚀 تیراندازی فضایی</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#04060f;
            font-family:system-ui,sans-serif;direction:rtl}
  canvas{display:block;position:fixed;inset:0;touch-action:none}
  
  #purchaseToast {
    position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, #ff2a6d, #b3003b);
    color: #fff; padding: 14px 28px; border-radius: 50px;
    font-size: 16px; font-weight: 800;
    box-shadow: 0 10px 30px rgba(179, 0, 59, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.3);
    z-index: 1000; transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
    opacity: 0; pointer-events: none; text-align: center; white-space: nowrap;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 10px;
  }
  #purchaseToast.show { top: 20px; opacity: 1; }
  #purchaseToast .gem { font-size: 20px; filter: drop-shadow(0 0 5px #ffd700); animation: pulseGem 1.5s infinite; }
  @keyframes pulseGem { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

  #tabs{position:fixed;top:0;left:0;right:0;height:50px;
    background:rgba(4,6,15,.85); border-bottom:1px solid rgba(0,255,255,.15);
    display:flex;z-index:10;backdrop-filter:blur(6px)}
  .tab{flex:1;background:transparent;border:none;
    color:#5a7d8f;font-size:14px;font-weight:600;
    cursor:pointer;transition:.3s;font-family:inherit}
  .tab.active{color:#7df9ff;box-shadow:inset 0 -2px 0 #0ff;text-shadow:0 0 10px rgba(0,255,255,.5)}
  .tab:active{background:rgba(0,255,255,.05)}

  .panel{position:fixed;top:50px;left:0;right:0;bottom:0;
    background:#04060f;color:#7df9ff;
    padding:20px;overflow-y:auto;display:none;z-index:5}
  .panel.show{display:block}
  .panel h2{text-align:center;font-size:22px;margin-bottom:10px;
    text-shadow:0 0 15px rgba(0,255,255,.5)}

  #rankList{list-style:none;max-width:400px;margin:0 auto}
  #rankList li{display:flex;align-items:center;
    padding:12px 18px;margin-bottom:10px;
    background:rgba(0,255,255,.05); border:1px solid rgba(0,255,255,.2);
    border-radius:12px;font-size:16px; transition: 0.3s;}
  #rankList li:hover { background:rgba(0,255,255,.1); transform: translateX(-5px); }
  #rankList li.empty{justify-content:center;color:#5a7d8f;font-size:15px}
  #rankList li.error{justify-content:center;color:#ff5c8a;font-size:15px}
  #rankList .pos{width:28px;height:28px;border-radius:50%;
    background:rgba(0,255,255,.1); display:flex;align-items:center;justify-content:center;
    font-weight:700;margin-left:10px;color:#7df9ff;font-size:14px}
  #rankList li:nth-child(1) .pos{background:gold;color:#04060f;box-shadow:0 0 10px gold;}
  #rankList li:nth-child(2) .pos{background:#c0c0c0;color:#04060f;}
  #rankList li:nth-child(3) .pos{background:#cd7f32;color:#04060f;}
  
  #rankList .avatar-svg { width: 28px; height: 28px; margin-right: 10px; display: flex; align-items: center; justify-content: center; }
  #rankList .avatar-svg svg { width: 100%; height: 100%; filter: drop-shadow(0 0 5px currentColor); }
  #rankList .name{color:#aaa;font-size:14px;margin-right:10px;width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #rankList .sc{flex:1;font-size:18px;font-weight:700;color:#fff;text-align:left}

  .refresh-btn { display: block; margin: 0 auto 15px auto; padding: 10px 20px; 
    background: rgba(0,255,255,0.1); border: 1px solid #0ff; color: #0ff; 
    border-radius: 20px; cursor: pointer; font-family: inherit; transition: 0.3s;}
  .refresh-btn:hover { background: rgba(0,255,255,0.2); }

  .profile-card {

    background: linear-gradient(145deg, rgba(0,255,255,0.05), rgba(4,6,15,0.8));
    border: 1px solid rgba(0, 255, 255, 0.3);
    box-shadow: 0 0 30px rgba(0, 255, 255, 0.15), inset 0 0 20px rgba(0,255,255,0.05);
    border-radius: 20px; text-align: center; position: relative; overflow: hidden;
    backdrop-filter: blur(10px);
  }
  .profile-card::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
    transform: skewX(-25deg); transition: 0.5s;
  }
  .profile-card:hover::before { left: 150%; }

  .preview-name { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: 1px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
  .preview-title { font-size: 12px; color: #0ff; margin-top: 5px; opacity: 0.8; letter-spacing: 2px; }
  
  .preview-total { margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(0,255,255,0.2); font-size: 16px; color: #ffd700; font-weight: bold; }

  .form-group label{display:block;margin-bottom:8px;color:#8bb5c9;font-size:14px;font-weight:600}

    background:rgba(0,0,0,0.4);border:1px solid rgba(0,255,255,0.2);
    color:#fff;font-family:inherit;font-size:16px;outline:none;transition: 0.3s;

  .form-group input[type="text"]:focus{border-color:#0ff; box-shadow: 0 0 15px rgba(0,255,255,0.3), inset 0 2px 5px rgba(0,0,0,0.5);}
  
  .avatar-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(60px, 1fr));gap:12px}
  .avatar-btn{
    background:rgba(255,255,255,0.03);border:2px solid transparent;
    border-radius:15px;padding:10px;cursor:pointer;transition:.3s;
    display: flex; align-items: center; justify-content: center; height: 70px;
  }
  .avatar-btn svg { width: 100%; height: 100%; transition: 0.3s; }
  .avatar-btn:hover { background:rgba(0,255,255,0.1); transform: translateY(-2px);}
  .avatar-btn.selected{border-color:#0ff;background:rgba(0,255,255,0.15);transform:scale(1.1); box-shadow: 0 0 15px rgba(0,255,255,0.4);}
  .avatar-btn.selected svg { filter: drop-shadow(0 0 10px currentColor); }
  
  .save-btn{display:block;width:100%;max-width:400px;margin:25px auto;padding:15px;
    background:linear-gradient(90deg, #00d2ff, #0ff);color:#04060f;border:none;border-radius:12px;
    font-size:18px;font-weight:bold;cursor:pointer;font-family:inherit;transition: 0.3s;
    box-shadow: 0 5px 15px rgba(0,255,255,0.3);}
  .save-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,255,255,0.5); }
  .save-btn:disabled { background: #333; color: #666; box-shadow: none; cursor: not-allowed; transform: none; }

  .shop-header{text-align:center;margin-bottom:20px;font-size:20px;color:#ffd700;font-weight:bold;text-shadow:0 0 10px rgba(255,215,0,0.5)}
  .shop-list{display:flex;flex-direction:column;gap:15px;max-width:500px;margin:0 auto}
  .weapon-card{
    display:flex;align-items:center;justify-content:space-between;
    background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(0,0,0,0.5));
    border:1px solid rgba(0,255,255,.15);
    padding:15px 20px;border-radius:15px;transition:.3s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  .weapon-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,255,255,0.1); border-color: rgba(0,255,255,0.4); }
  .weapon-card.owned{ border-color: rgba(0,255,0,.3); background: linear-gradient(145deg, rgba(0,255,0,0.05), rgba(0,0,0,0.5)); }
  .weapon-card.equipped{ border-color: #0ff; box-shadow: 0 0 20px rgba(0,255,255,0.2); }
  
  .w-info h3{font-size:17px;margin-bottom:5px;color:#fff}
  .w-info p{font-size:13px;color:#8bb5c9}
  .w-action{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .w-price{font-size:15px;font-weight:bold;color:#ffd700;text-shadow:0 0 5px rgba(255,215,0,0.5)}
  
  .w-btn{
    padding:10px 20px;border-radius:25px;border:none;cursor:pointer;
    font-family:inherit;font-weight:bold;font-size:14px;transition:.3s;
    letter-spacing: 0.5px;
  }
  .btn-buy{
    background: linear-gradient(45deg, #ffd700, #ffaa00);
    color:#000; box-shadow: 0 0 15px rgba(255,215,0,0.4);
  }
  .btn-buy:active { transform: scale(0.95); }
  .btn-buy:disabled{ background: #333; color:#666; box-shadow:none; cursor:not-allowed; transform:none;}
  
  .btn-equip{
    background: transparent; border:1px solid #0ff; color:#0ff;
    box-shadow: inset 0 0 10px rgba(0,255,255,0.1);
  }
  .btn-equip:active { transform: scale(0.95); background: rgba(0,255,255,0.1); }
  
  .btn-equipped{
    background: linear-gradient(45deg, #00ffcc, #00ccff);
    color:#000; box-shadow: 0 0 15px rgba(0,255,204,0.5);
  }

  #gameOver{position:fixed;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:15px;
    background:rgba(4,6,15,.9);color:#fff;text-align:center;z-index:20;backdrop-filter:blur(5px)}
  #gameOver h1{font-size:36px;color:#ff5c8a;text-shadow:0 0 20px #ff5c8a}
  #gameOver p{font-size:20px;color:#7df9ff}
  #gameOver .final-score{font-size:28px;font-weight:bold;color:#fff;margin:10px 0}
  
  #bonusCoins { font-size: 20px; color: #ffd700; font-weight: bold; margin-bottom: 15px; text-shadow: 0 0 10px rgba(255,215,0,0.5); }

  #restartBtn{margin-top:10px;padding:14px 40px;font-size:20px;
    border:2px solid #0ff;background:transparent;color:#0ff;
    border-radius:40px;cursor:pointer;font-family:inherit;transition:0.3s}
  #restartBtn:active{background:#0ff;color:#04060f}

  .music-player { 
    max-width: 400px; margin: 20px auto; padding: 20px; 
    background: linear-gradient(145deg, rgba(0,255,255,0.05), rgba(4,6,15,0.8));
    border: 1px solid rgba(0,255,255,0.2); border-radius: 15px;
    box-shadow: inset 0 0 20px rgba(0,255,255,0.05);
    text-align: center;
  }
  .music-player label { font-size: 15px; color: #0ff; display: block; margin-bottom: 15px; font-weight: bold; }
  
  .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; margin-bottom: 15px; }
  .file-upload-wrapper input[type="file"] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .file-upload-btn {
    border: 1px dashed #0ff; color: #0ff; padding: 15px;
    border-radius: 10px; display: block; font-size: 14px;
    background: rgba(0,255,255,0.05); transition: 0.3s;
  }
  .file-upload-wrapper:hover .file-upload-btn { background: rgba(0,255,255,0.15); }
  
  .music-controls { display: flex; gap: 10px; }
  .music-controls button {
    flex: 1; padding: 12px; border-radius: 10px; font-family: inherit;
    font-weight: bold; cursor: pointer; transition: 0.3s; border: none; font-size: 15px;
  }
  #playBgmBtn { background: linear-gradient(90deg, #00ffcc, #00ccff); color: #000; box-shadow: 0 0 10px rgba(0,255,204,0.4); }
  #playBgmBtn:active { transform: scale(0.95); }
  #pauseBgmBtn { background: transparent; border: 1px solid #ff5c8a; color: #ff5c8a; box-shadow: inset 0 0 10px rgba(255,92,138,0.2); }
  #pauseBgmBtn:active { transform: scale(0.95); background: rgba(255,92,138,0.1); }

  #syncIndicator {
    position: fixed; bottom: 20px; left: 20px;
    color: #0ff; font-size: 24px; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; z-index: 100;
    text-shadow: 0 0 10px #0ff;
  }
  #syncIndicator.syncing { opacity: 1; animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.2); } }
</style>
</head>
<body>
<div id="purchaseToast">
  <span class="gem">💎</span>
  <span id="toastText">سلاح خریداری شد!</span>
  <span class="gem">💎</span>
</div>

<div id="tabs">
  <button class="tab active" data-tab="game">🎮 بازی</button>
  <button class="tab" data-tab="shop">🛒 فروشگاه</button>
  <button class="tab" data-tab="rank">🏆 رتبه‌ها</button>

</div>

<div id="syncIndicator">☁️</div>

<canvas id="c"></canvas>

<div id="shopPanel" class="panel">

  <div class="shop-header">💰 موجودی شما: <span id="shopCoins">0</span> سکه</div>
  <div class="shop-list" id="shopList"></div>
</div>

<div id="rankPanel" class="panel">
  <h2>🏆 رتبه‌بندی آنلاین</h2>
  <button class="refresh-btn" onclick="renderRank()">🔄 بروزرسانی لیست</button>
  <ol id="rankList"></ol>
</div>

<div id="profilePanel" class="panel">
  <h2>👤 پروفایل شما</h2>
  
  <div class="profile-card">
    <div class="preview-avatar" id="previewAvatar"></div>
    <div class="preview-name" id="previewName">در حال بارگذاری...</div>
    <div class="preview-title">SPACE COMMANDER</div>
    <div class="preview-total">🌟 مجموع امتیازات: <span id="totalScoreVal">0</span></div>

  <div class="form-group">

      <input type="file" id="bgmUpload" accept="audio/*">
    </div>
    <div class="music-controls">
      <button id="playBgmBtn">▶️ پخش</button>
      <button id="pauseBgmBtn">⏸️ توقف</button>
    </div>
  </div>

  <button class="save-btn" id="saveProfileBtn">ذخیره پروفایل</button>
</div>

<div id="gameOver">

  <p>جونات تموم شد...</p>
  <div class="final-score">امتیاز این دست: <span id="finalScoreVal">0</span></div>

  <button id="restartBtn">شروع مجدد</button>
</div>

let S, isDead = false;
let currentBossIndex = 0;
let nextBossScore = 1000;
let isBossActive = false;

  };

const keys = {left:false, right:false, fire:false};
let touching = false, touchX = null;

addEventListener('keydown', e => {
  if(['ArrowLeft','a','A'].includes(e.key)) keys.left = true;
  if(['ArrowRight','d','D'].includes(e.key)) keys.right = true;
  if(e.key === ' '){ keys.fire = true; e.preventDefault(); }
});
addEventListener('keyup', e => {
  if(['ArrowLeft','a','A'].includes(e.key)) keys.left = false;
  if(['ArrowRight','d','D'].includes(e.key)) keys.right = false;
  if(e.key === ' ') keys.fire = false;
});

cvs.addEventListener('touchstart', e => { e.preventDefault(); touching = true; const t = e.touches[0]; if(t) touchX = t.clientX; }, {passive:false});
cvs.addEventListener('touchmove', e => { e.preventDefault(); const t = e.touches[0]; if(t) touchX = t.clientX; }, {passive:false});
cvs.addEventListener('touchend', e => { e.preventDefault(); touching = false; touchX = null; }, {passive:false});

cvs.addEventListener('mousedown', () => { keys.fire = true; });
addEventListener('mouseup', () => keys.fire = false);
cvs.addEventListener('mousemove', e => { if(keys.fire) touchX = e.clientX; });

function fire(){
  const w = S.tempWeapon ? S.tempWeapon : WEAPONS.find(x => x.id === equippedWeapon);
  S.cool = w.cd;

  for(let i = 0; i < w.count; i++){
    let angle = 0;
    if(w.count > 1){
      const spreadRad = (w.spread * Math.PI) / 180;
      angle = -spreadRad/2 + (spreadRad / (w.count - 1)) * i;
    }
    const speed = 1.6;
    S.bullets.push({ x: S.player.x, y: S.player.y - 22, vx: Math.sin(angle) * speed, vy: -Math.cos(angle) * speed, dmg: w.dmg, color: w.color, size: w.size });
  }
}

// 👈 شلیک غول‌ها (خیلی آروم و با فاصله)
function bossShoot(boss, pattern) {
  const speed = 0.2 + currentBossIndex * 0.05; // سرعت خیلی کم
  const angleToPlayer = Math.atan2(S.player.y - boss.y, S.player.x - boss.x);
  
  if (pattern === 'aimed') {
    S.ebullets.push({
      x: boss.x, y: boss.y + 20,
      vx: Math.cos(angleToPlayer) * speed,
      vy: Math.sin(angleToPlayer) * speed,
      r: 8, color: '#ff4fd8'
    });
  } 
  else if (pattern === 'spread') {
    const count = 3; 
    for (let i = 0; i < count; i++) {
      const spreadAngle = angleToPlayer + (i - 1) * 0.3; 
      S.ebullets.push({
        x: boss.x, y: boss.y + 20,
        vx: Math.cos(spreadAngle) * speed,
        vy: Math.sin(spreadAngle) * speed,
        r: 6, color: '#ffd166'
      });
    }
  }
  else if (pattern === 'radial') {
    const count = 6; 
    const baseAngle = S.t * 0.02;
    for (let i = 0; i < count; i++) {
      const angle = baseAngle + (i / count) * Math.PI * 2;
      S.ebullets.push({
        x: boss.x, y: boss.y,
        vx: Math.cos(angle) * speed * 0.8,
        vy: Math.sin(angle) * speed * 0.8,
        r: 6, color: '#7df9ff'
      });
    }
  }
}

function spawnEnemy(){
  const r = 11 + Math.random()*9;
  const diffSpeed = Math.min(S.score / 500, 1); 
  const diffHp = Math.min(S.score / 1000, 3);   

  // 👈 محاسبه جون شهاب‌سنگ بر اساس امتیاز (هر ۵۰ امتیاز، ۵ تا بیشتر)
  const rockBaseHp = 5 + Math.floor(S.score / 50) * 5;

  const enemy = {
    x: 30 + Math.random()*(W - 60), y: -30, r,
    vy: 0.16 + Math.random()*0.10 + diffSpeed*0.25,
    vx: (Math.random() - 0.5) * 0.12,
    hue: 330 + Math.random()*50, rot: Math.random()*6.28, rv: (Math.random() - 0.5) * 0.005,
    hp: (r > 17 ? 3 : 2) + Math.floor(diffHp),
    isBoss: false
  };

  if (Math.random() < 0.3) { 
      enemy.type = 'rock';
      enemy.hp = rockBaseHp;
      enemy.r = 20 + Math.random()*10;
  }

  S.enemies.push(enemy);
}

function spawnBoss(){
  const hp = 200 + (currentBossIndex * 300); // 👈 ۲۰۰، ۵۰۰، ۸۰۰...
  
  S.enemies.push({
    x: W/2, y: -150, r: 65, // از بالا شروع میکنه
    vy: 0.05, vx: 0.15, 
    hue: 280, rot: 0, rv: 0.01,
    hp: hp, 
    maxHp: hp, 
    isBoss: true,
    shootT: 4000, // ۴ ثانیه فرصت قبل از اولین شلیک (بر حسب میلی‌ثانیه)
    patternIdx: 0
  });
}

function spawnPowerup(x, y, isBossDrop) {
  let w = DROP_WEAPONS[Math.floor(Math.random() * DROP_WEAPONS.length)];
  S.powerups.push({ x: x, y: y, vy: 0.5, weapon: w, r: 12, rot: 0 });
}

function boom(x, y, hue, n){
  for(let i = 0; i < n; i++){
    const a = Math.random()*6.28, s = Math.random()*0.45 + 0.05;
    S.parts.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, hue, r: Math.random()*2.5 + 1 });
  }
}

let lastSync = 0;
function autoSync() {
    if(!isDead && S && S.score > 0) {
        let currentTotal = totalScore + S.score;
        if(currentTotal > lastSync + 10) { 
            saveScoreToLeaderboard(currentTotal, true);
            lastSync = currentTotal;
        }
    }
}
setInterval(autoSync, 15000);

function update(dt){
  if(S.lives <= 0) return;

  S.t++;
  if(S.t % 120 === 0) saveData();

  if (S.tempWeaponTime > 0) {
    S.tempWeaponTime -= dt;
    if (S.tempWeaponTime <= 0) S.tempWeapon = null;
  }
  
  if (S.player.inv > 0) S.player.inv -= dt;

  if (S.score >= nextBossScore && !isBossActive) {
    spawnBoss();
    isBossActive = true;
    S.enemies = S.enemies.filter(e => e.isBoss);
  }

  for(const s of S.stars){ s.y += s.z * dt * 0.12; if(s.y > H){ s.y = 0; s.x = Math.random()*W; } }
  
  const p = S.player;
  const sp = 0.9 * dt;
  if(keys.left)  p.x -= sp;
  if(keys.right) p.x += sp;
  if(touchX !== null){ 
    const d = touchX - p.x; p.x += Math.max(-sp*1.6, Math.min(sp*1.6, d)); 
  }
  p.x = Math.max(22, Math.min(W - 22, p.x));

  S.cool -= dt;
  if((keys.fire || touching) && S.cool <= 0) fire();
  for(const b of S.bullets) { b.x += b.vx * dt; b.y += b.vy * dt; }

  S.spawnT -= dt;
  if (S.spawnT <= 0) {
    if (!isBossActive) {
        spawnEnemy();
        S.spawnT = Math.max(280, 820 - S.score * 1.2);
    } else {
        S.spawnT = 1000; 
    }
  }

  for(let i = S.enemies.length - 1; i >= 0; i--){
    const e = S.enemies[i];
    e.y += e.vy * dt; e.x += e.vx * dt; e.rot += e.rv * dt;
    
    if(e.isBoss) {
      if (e.x < e.r || e.x > W - e.r) e.vx *= -1;
      
      // 👈 غول آروم میاد پایین و وایمیسه
      if (e.y > 120) e.y = 120; 

      // اگه به جایگاهش رسید، شروع میکنه به شلیک کردن
      if (e.y >= 120) {
          e.shootT -= dt;
          if (e.shootT <= 0) {
            e.shootT = Math.max(3000, 5000 - currentBossIndex * 200); // هر ۳ تا ۵ ثانیه
            const patterns = ['aimed', 'spread', 'radial'];
            bossShoot(e, patterns[e.patternIdx % patterns.length]);
            e.patternIdx++;
          }
      }
    } else {
        if (e.x < e.r || e.x > W - e.r) e.vx *= -1;
    }
  }

  for(let i = S.ebullets.length - 1; i >= 0; i--) {
    const eb = S.ebullets[i];
    eb.x += eb.vx * dt;
    eb.y += eb.vy * dt;
    
    if (eb.x < -20 || eb.x > W + 20 || eb.y < -20 || eb.y > H + 20) {
      S.ebullets.splice(i, 1);
      continue;
    }
    
    if (S.lives > 0 && S.player.inv <= 0) {
      const dx = eb.x - S.player.x;
      const dy = eb.y - S.player.y;
      const rr = eb.r + S.player.r + 3;
      if (dx*dx + dy*dy < rr*rr) {
        S.ebullets.splice(i, 1);
        S.lives--;
        S.shake = 220;
        S.player.inv = 1500; // 👈 ۱.۵ ثانیه مصونیت (بر حسب میلی‌ثانیه)
        boom(S.player.x, S.player.y, 0, 15);
        if(S.lives <= 0) triggerGameOver();
      }
    }
  }

  for(let i = S.bullets.length - 1; i >= 0; i--){
    const b = S.bullets[i];
    for(let j = S.enemies.length - 1; j >= 0; j--){
      const e = S.enemies[j];
      const dx = b.x - e.x, dy = b.y - e.y;
      if(dx*dx + dy*dy < (e.r + 4)**2){
        S.bullets.splice(i, 1); e.hp -= b.dmg; boom(b.x, b.y, 180, 3);
        if(e.hp <= 0){ 
          boom(e.x, e.y, e.hue, e.isBoss ? 50 : 10); 
          S.enemies.splice(j, 1); 
          S.score += e.isBoss ? 500 : 10; 
          
          let coinMultiplier = 1 + Math.floor(S.score / 1000);
          let coinReward = e.isBoss ? 50 : 2;
          coins += coinReward * coinMultiplier; 
          
          if (e.isBoss) {
            isBossActive = false; 
            currentBossIndex++; 
            nextBossScore = (currentBossIndex + 1) * 1000;
            if (Math.random() < 0.5) spawnPowerup(e.x, e.y, true);
          } else if (Math.random() < 0.01) {
            spawnPowerup(e.x, e.y, false);
          }
          saveData(); 
        }
        break;
      }
    }
  }

  for(let j = S.enemies.length - 1; j >= 0; j--){
    const e = S.enemies[j];
    const dx = p.x - e.x, dy = p.y - e.y;
    if(dx*dx + dy*dy < (e.r + p.r)**2){
      if (S.player.inv <= 0) {
          boom(e.x, e.y, e.hue, 12); S.enemies.splice(j, 1); S.shake = 220; S.lives--;
          S.player.inv = 1500; 
          if(e.isBoss) isBossActive = false;
          if(S.lives <= 0) triggerGameOver();
      }
      break;
    }
  }

  for(let i = S.powerups.length - 1; i >= 0; i--){
    const pu = S.powerups[i];
    pu.y += pu.vy * dt; pu.rot += 0.05 * dt;
    const dx = p.x - pu.x, dy = p.y - pu.y;
    if(dx*dx + dy*dy < (pu.r + p.r + 15)**2){
      S.tempWeapon = pu.weapon; S.tempWeaponTime = 10000;
      S.powerups.splice(i, 1); boom(pu.x, pu.y, 180, 15);
      continue;
    }
    if(pu.y > H + 50) S.powerups.splice(i, 1);
  }

  for(let j = S.enemies.length - 1; j >= 0; j--){
    if(S.enemies[j].y > H + 100 && !S.enemies[j].isBoss){ S.enemies.splice(j, 1); S.lives--; if(S.lives <= 0) triggerGameOver(); }
  }

  for(let i = S.parts.length - 1; i >= 0; i--){
    const q = S.parts[i];
    q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 0.0004 * dt; q.life -= dt * 0.0016;
    if(q.life <= 0) S.parts.splice(i, 1);
  }
  if(S.shake > 0) S.shake -= dt;
  S.bullets = S.bullets.filter(b => b.y > -20 && b.y < H + 20 && b.x > -20 && b.x < W + 20);
}

function triggerGameOver() {
  isDead = true;
  const achievedScore = S.score;
  const bonusCoins = Math.floor(achievedScore / 10);
  
  if(achievedScore > 0) {
    totalScore += achievedScore; 
    coins += bonusCoins; 
    saveData(); 
    localStorage.setItem('shooter_current_score', 0); 
    saveScoreToLeaderboard(totalScore); 
    
    document.getElementById('finalScoreVal').textContent = achievedScore;
    document.getElementById('bonusCoins').textContent = '💰 پاداش سکه: +' + bonusCoins;
    document.getElementById('bonusCoins').style.display = 'block';
  } else {
    localStorage.setItem('shooter_current_score', 0);
    document.getElementById('finalScoreVal').textContent = 0;
    document.getElementById('bonusCoins').style.display = 'none';
  }
  
  document.getElementById('gameOver').style.display = 'flex';
}

function draw(){
  const sh = S.shake > 0 ? (Math.random() - 0.5) * S.shake * 0.03 : 0;
  ctx.setTransform(1, 0, 0, 1, sh, sh);
  
  ctx.fillStyle = 'rgba(4,6,15,0.5)'; 
  ctx.fillRect(-10, -10, W + 20, H + 20);

  ctx.fillStyle = '#8fd8ff';
  for(const s of S.stars){ ctx.globalAlpha = s.z * 0.7; ctx.fillRect(s.x, s.y, s.z * 1.6, s.z * 2.6); }
  ctx.globalAlpha = 1;

  for(const q of S.parts){
    ctx.globalAlpha = Math.max(q.life, 0); ctx.fillStyle = 'hsl(' + q.hue + ',100%,65%)';
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r * q.life, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for(const pu of S.powerups) {
    ctx.save(); ctx.translate(pu.x, pu.y); ctx.rotate(pu.rot);
    ctx.fillStyle = pu.weapon.color; ctx.shadowBlur = 15; ctx.shadowColor = pu.weapon.color;
    ctx.beginPath(); ctx.moveTo(0, -pu.r); ctx.lineTo(pu.r, 0); ctx.lineTo(0, pu.r); ctx.lineTo(-pu.r, 0);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  ctx.shadowBlur = 0;

  for(const eb of S.ebullets) {
    ctx.fillStyle = eb.color;
    ctx.shadowBlur = 15;
    ctx.shadowColor = eb.color;
    ctx.beginPath();
    ctx.arc(eb.x, eb.y, eb.r, 0, 6.28);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(eb.x, eb.y, eb.r * 0.5, 0, 6.28);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  for(const b of S.bullets) {
    ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 0.5; ctx.fillRect(b.x - b.size/2, b.y + b.size, b.size, 10); ctx.globalAlpha = 1;
  }

  for(const e of S.enemies){
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.rot);
    ctx.strokeStyle = 'hsl(' + e.hue + ',100%,70%)'; ctx.fillStyle = 'hsla(' + e.hue + ',100%,55%,.25)';
    ctx.lineWidth = e.isBoss ? 5 : 2; ctx.beginPath();
    
    if (e.isBoss) {
       for(let k=0; k<10; k++){
          const r2 = k%2===0 ? e.r : e.r/2;
          const a = k * Math.PI/5;
          const px = Math.cos(a)*r2, py = Math.sin(a)*r2;
          k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
       }
    } else {
       for(let k = 0; k < 6; k++){
        const a = k / 6 * 6.283; const px = Math.cos(a) * e.r, py = Math.sin(a) * e.r;
        k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
       }
    }
    ctx.closePath(); ctx.fill(); ctx.stroke(); 
    if (e.isBoss) {
        ctx.rotate(-e.rot); ctx.fillStyle = 'red'; ctx.fillRect(-e.r, -e.r - 20, e.r*2, 6);
        ctx.fillStyle = 'lime';
        const hpPct = Math.max(0, e.hp / e.maxHp);
        ctx.fillRect(-e.r, -e.r - 20, e.r*2 * hpPct, 6);
    }
    ctx.restore();
  }

  if(S.lives > 0) {
    const p = S.player;
    // افکت چشمک زدن موقع مصونیت
    if (p.inv > 0 && Math.floor(S.t * 0.1) % 2 === 0) {
        // چشمک نمیزنه
    } else {
        ctx.fillStyle = '#a8ffd0'; ctx.beginPath();
        ctx.moveTo(p.x, p.y - 20); ctx.lineTo(p.x - 14, p.y + 12); ctx.lineTo(p.x, p.y + 6); ctx.lineTo(p.x + 14, p.y + 12);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'hsla(' + (30 + Math.random()*20) + ',100%,65%,.85)'; ctx.beginPath();
        ctx.moveTo(p.x - 5, p.y + 10); ctx.lineTo(p.x, p.y + 16 + Math.random()*10); ctx.lineTo(p.x + 5, p.y + 10);
        ctx.closePath(); ctx.fill();
    }
  }

  ctx.font = '600 16px system-ui,sans-serif'; ctx.textAlign = 'left';
  ctx.fillStyle = '#7df9ff'; ctx.fillText('امتیاز این دست  ' + S.score, 18, 82);
  ctx.fillStyle = '#ffd700'; ctx.fillText('💰 ' + coins, 18, 110);
  
  let currentMultiplier = 1 + Math.floor(S.score / 1000);
  if (currentMultiplier > 1) {
      ctx.fillStyle = '#00ffcc';
      ctx.fillText('🔥 ضریب سکه: x' + currentMultiplier, 18, 138);
  }

  if (S.tempWeapon) {
      ctx.fillStyle = S.tempWeapon.color; ctx.fillText('⚡ ' + S.tempWeapon.name + ' (' + Math.ceil(S.tempWeaponTime/1000) + 's)', 18, currentMultiplier > 1 ? 166 : 138);
  }

  ctx.textAlign = 'right'; ctx.fillStyle = '#ff5c8a'; ctx.fillText('❤️'.repeat(Math.max(0, S.lives)), W - 18, 82);
}

async function getScores(){
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/leaderboard?select=*&order=score.desc&limit=10`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    if (res.ok) {
        return await res.json();
    }
  } catch(e) {}
  return [];
}

async function saveScoreToLeaderboard(newTotalScore, isSilent = false){
  if(newTotalScore <= 0) return;
  
  const syncIcon = document.getElementById('syncIndicator');
  if (syncIcon) syncIcon.classList.add('syncing');

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/leaderboard?on_conflict=dev_id`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify({ 
        dev_id: deviceId, 
        name: profile.name, 
        score: newTotalScore, 
        avatar: profile.avatar 
      })
    });
    
    if (!res.ok) {
        const errorData = await res.text();
        if (!isSilent) alert("خطا در ذخیره امتیاز:\n" + errorData);
        console.log("خطای سوپابیس:", errorData);
    }
  } catch(e) {
    if (!isSilent) alert("خطای شبکه در ذخیره امتیاز:\n" + e.message);
  }

  if (syncIcon) setTimeout(() => syncIcon.classList.remove('syncing'), 500);
}

async function renderRank(){
  const list = document.getElementById('rankList');
  list.innerHTML = '<li class="empty">در حال دریافت رکوردها...</li>';
  
  const scores = await getScores();
  
  if(scores.length === 0){
    list.innerHTML = '<li class="empty">هنوز رکوردی ثبت نشده — بازی کن!</li>';
    return;
  }
  
  list.innerHTML = scores.map((s, i) => {
    let avatarHtml = '';
    if (typeof s.avatar === 'number') {
      const av = getAvatarById(s.avatar);
      avatarHtml = `<div class="avatar-svg" style="color: ${av.color}">${av.svg}</div>`;
    } else {
      avatarHtml = `<div class="avatar-svg" style="font-size:20px;">${s.avatar || '👾'}</div>`;
    }
    return '<li>' +
      '<span class="pos">' + (i+1) + '</span>' + avatarHtml +
      '<span class="name">' + (s.name || 'ناشناس') + '</span>' +
      '<span class="sc">' + s.score + '</span>' +
    '</li>';
  }).join('');
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.onclick = async () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
    document.getElementById('shopPanel').classList.toggle('show', tab === 'shop');
    document.getElementById('rankPanel').classList.toggle('show', tab === 'rank');
    document.getElementById('profilePanel').classList.toggle('show', tab === 'profile');
    
    if(tab === 'shop') { 
        renderShop(); 
    } else if(tab === 'rank'){ 
        await saveScoreToLeaderboard(totalScore + (S ? S.score : 0), false);
        renderRank(); 
    }
  };
});

document.getElementById('restartBtn').onclick = () => {
  reset();
  document.querySelector('.tab[data-tab="game"]').click();
};

let last = 0;
function loop(ts){
  const dt = last ? Math.min(ts - last, 50) : 16;
  last = ts;
  const onGame = !document.getElementById('rankPanel').classList.contains('show') && 
                 !document.getElementById('profilePanel').classList.contains('show') &&
                 !document.getElementById('shopPanel').classList.contains('show');
  if(onGame){ update(dt); draw(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
