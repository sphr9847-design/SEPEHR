<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🚀 تیراندازی فضایی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#04060f;
            font-family:'Vazirmatn', system-ui, sans-serif;direction:rtl}
  
  #c { display:block; position:fixed; inset:0; touch-action:none; }
  
  /* ═══════════ افکت هشدار خطر (دور صفحه) ═══════════ */
  #dangerOverlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 4;
    box-shadow: inset 0 0 0 rgba(128, 11, 27, 0);
    transition: box-shadow 0.5s;
  }
  #dangerOverlay.show {
    animation: edgeGlow 1.2s infinite alternate;
  }
  @keyframes edgeGlow {
    from { box-shadow: inset 0 0 30px rgba(128, 11, 27, 0.1); }
    to { box-shadow: inset 0 0 100px rgba(128, 11, 27, 0.6); }
  }

  /* ═══════════ اعلان هشدار وسط صفحه ═══════════ */
  #bossWarning {
    position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(20, 0, 4, 0.7);
    border: 2px solid rgba(255, 92, 138, 0.6);
    padding: 12px 35px; border-radius: 15px;
    display: flex; align-items: center; justify-content: center; gap: 15px;
    font-size: 26px; font-weight: 900; color: #ffb3b3;
    font-family: 'Vazirmatn', sans-serif; letter-spacing: 4px;
    z-index: 1500; pointer-events: none;
    opacity: 0; transition: opacity 0.3s;
    box-shadow: 0 0 25px rgba(255, 92, 138, 0.3), inset 0 0 15px rgba(255, 92, 138, 0.1);
    text-shadow: 0 0 10px rgba(255, 92, 138, 0.8);
  }
  #bossWarning.show { opacity: 0.85; animation: warnPulse 1.5s infinite; }
  
  @keyframes warnPulse {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.03); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }
  
  .warn-icon {
    display: flex; align-items: center; justify-content: center;
    color: #ff5c8a;
  }
  .warn-icon svg {
    width: 28px; height: 28px;
    filter: drop-shadow(0 0 8px #ff5c8a);
    animation: iconPulse 1s infinite alternate;
  }
  @keyframes iconPulse {
    from { transform: scale(1); opacity: 0.8; }
    to { transform: scale(1.15); opacity: 1; }
  }

  /* ═══════════ اعلان خرید ═══════════ */
  #toastNotification {
    position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, #800b1b, #3e0006);
    color: #ffe6e6; padding: 14px 28px; border-radius: 20px;
    font-size: 15px; font-weight: 700;
    box-shadow: 0 10px 30px rgba(62, 0, 6, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 100, 100, 0.2);
    z-index: 2000; transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
    opacity: 0; pointer-events: none; text-align: center; white-space: nowrap;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center;
    max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
  }
  #toastNotification.show { top: 20px; opacity: 1; }

  /* ═══════════ تب‌ها ═══════════ */
  #tabs{position:fixed;top:0;left:0;right:0;height:50px;
    background:rgba(4,6,15,.85); border-bottom:1px solid rgba(0,255,255,.15);
    display:flex;z-index:10;backdrop-filter:blur(6px)}
  
  .tab{flex:1;background:transparent;border:none;
    color:#5a7d8f;font-size:13px;font-weight:600;
    cursor:pointer;transition:.3s;font-family:inherit;position:relative;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 0 5px;}
    
  .tab svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: 0.3s; }

  .tab.active svg { filter: drop-shadow(0 0 5px rgba(0,255,255,0.8)); }

    content: ''; position: absolute; bottom: 0; left: 50%;
    width: 0; height: 3px;
    background: linear-gradient(90deg, #0ff, #ff4fd8);
    border-radius: 3px 3px 0 0;
