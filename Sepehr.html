<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وبلاگ شخصی من</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f8f9fa; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #2c3e50; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        textarea { width: 100%; height: 90px; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd; background: #fafafa; color: #333; box-sizing: border-box; font-family: inherit; resize: none; }
        textarea:focus { outline: none; border-color: #007bff; background: #fff; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #0056b3; }
        .comment { background: #f1f3f5; border-right: 4px solid #007bff; padding: 15px; margin-bottom: 15px; border-radius: 8px; word-wrap: break-word; }
        .comment strong { color: #007bff; display: block; margin-bottom: 5px; }
        .comment-content { color: #495057; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="container">
        <h2>💬 نظرات کاربران</h2>
        
        <textarea id="commentInput" placeholder="نظر خود را بنویسید..."></textarea>
        <button onclick="addComment()">ثبت نظر</button>
        
        <hr style="margin: 25px 0; border-color: #eee;">
        
        <h3>آخرین نظرات:</h3>
        <div id="commentsList"></div>
    </div>

    <script>
        // دریافت و نمایش نظرات از حافظه مرورگر
        function loadComments() {
            let comments = JSON.parse(localStorage.getItem('sepehr_comments')) || [];
            let list = document.getElementById('commentsList');
            list.innerHTML = ''; // پاک کردن لیست قبلی

            comments.forEach((c, index) => {
                let div = document.createElement('div');
                div.className = 'comment';
                
                // 🚨 نقطه آسیب‌پذیری (Stored XSS): استفاده از innerHTML
                div.innerHTML = `<strong>کاربر ${index + 1}</strong><div class="comment-content">${c.text}</div>`;
                
                list.appendChild(div);
            });
        }

        // ارسال نظر جدید
        function addComment() {
            let input = document.getElementById('commentInput').value;
            if (input.trim() === '') return;

            let comments = JSON.parse(localStorage.getItem('sepehr_comments')) || [];
            comments.push({ text: input, time: Date.now() });
            
            localStorage.setItem('sepehr_comments', JSON.stringify(comments));
            document.getElementById('commentInput').value = '';
            loadComments();
        }

        // اجرای اولیه
        loadComments();
    </script>
</body>
</html>
