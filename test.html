<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمایشگاه XSS</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        input { padding: 10px; width: 80%; }
        button { padding: 10px 20px; }
    </style>
</head>
<body>

    <h2>سایت آسیب‌پذیر من</h2>
    <input type="text" id="userInput" placeholder="کد رو اینجا بذار...">
    <button onclick="showText()">ارسال</button>
    <div id="output" style="margin-top: 20px;"></div>

    <script>
        // 🔴 این بخش جدید است: چک کردن دائمی بودن هک
        if (localStorage.getItem('hacked') === 'true') {
            document.body.innerHTML = '<h1 style="color:red;text-align:center;margin-top:100px;">HACKED PERMANENTLY!</h1>';
        }

        function showText() {
            let input = document.getElementById('userInput').value;
            document.getElementById('output').innerHTML = input; 
        }
    </script>
</body>
</html>
