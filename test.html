<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمایشگاه XSS (ناامن)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background-color: #f0f0f0; }
        .box { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { padding: 10px; width: 80%; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #output { margin-top: 20px; padding: 15px; border: 2px dashed #dc3545; background: #ffe6e6; min-height: 50px; text-align: right; }
    </style>
</head>
<body>

    <div class="box">
        <h2>سایت آسیب‌پذیر من</h2>
        <p>کد مخرب رو اینجا بذار:</p>
        
        <input type="text" id="userInput" placeholder="مثلا کد img...">
        <button onclick="showText()">ارسال</button>
        
        <div id="output">خروجی اینجا نمایش داده می‌شود...</div>
    </div>

    <script>
        function showText() {
            let input = document.getElementById('userInput').value;
            // 🔴 نقطه آسیب‌پذیری: استفاده از innerHTML
            document.getElementById('output').innerHTML = input; 
        }
    </script>
</body>
</html>
