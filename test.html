<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>آزمایشگاه XSS (امن شده)</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h2>سایت امن شده من</h2>
    <input type="text" id="userInput" placeholder="کد رو اینجا بذار...">
    <button onclick="showText()">ارسال</button>
    <div id="output" style="margin-top: 20px; border: 1px solid #ccc; padding: 10px;"></div>

    <script>
        function showText() {
            let input = document.getElementById('userInput').value;
            
            // ✅ استفاده از innerText به جای innerHTML
            document.getElementById('output').innerText = input; 
        }
    </script>
</body>
</html>
