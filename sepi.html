<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وبلاگ شخصی من</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f8f9fa; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 80px; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;}
        .comment { background: #f1f3f5; border-right: 4px solid #007bff; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .error-box { background: #f8d7da; color: #721c24; padding: 10px; margin-top: 10px; border-radius: 5px; border: 1px solid #f5c6cb; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>💬 نظرات کاربران</h2>
        <textarea id="commentInput" placeholder="نظر خود را بنویسید..."></textarea>
        <button onclick="addComment()">ثبت نظر</button>
        <hr>
        <h3>آخرین نظرات:</h3>
        <div id="commentsList">در حال دریافت...</div>
        <div id="errorBox" class="error-box" style="display:none;"></div>
    </div>

    <!-- کتابخانه Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://wjgnbgbcqdtdcxonyrsb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_2vuFvK2Mu51Y_mY6pMsILA_phg-0PIs';

        // ساخت کلاینت سوپابیس در سطح جهانی
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // تابع نمایش خطا
        function showError(msg) {
            const errorBox = document.getElementById('errorBox');
            errorBox.style.display = 'block';
            errorBox.innerText = 'خطا: ' + msg;
        }

        // دریافت نظرات از دیتابیس
        async function loadComments() {
            const { data, error } = await supabase
                .from('xss_comments')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error('خطای دیتابیس:', error);
                showError(error.message);
                document.getElementById('commentsList').innerText = 'خطا در دریافت نظرات.';
                return;
            }

            const list = document.getElementById('commentsList');
            list.innerHTML = ''; 

            if (data.length === 0) {
                list.innerText = 'هنوز هیچ نظری ثبت نشده است.';
            }

            data.forEach((c, index) => {
                let div = document.createElement('div');
                div.className = 'comment';
                // 🚨 نقطه آسیب‌پذیری (Stored XSS)
                div.innerHTML = `<strong>کاربر ${index + 1}</strong><br>${c.content}`;
                list.appendChild(div);
            });
        }

        // ارسال نظر به دیتابیس
        async function addComment() {
            const input = document.getElementById('commentInput');
            const text = input.value;
            if (!text.trim()) return;

            console.log('در حال ارسال به دیتابیس...');

            const { error } = await supabase
                .from('xss_comments')
                .insert([{ content: text }]);

            if (error) {
                console.error('خطای ارسال:', error);
                showError(error.message);
            } else {
                console.log('با موفقیت ارسال شد!');
                input.value = '';
                document.getElementById('errorBox').style.display = 'none';
                loadComments(); // لیست رو دوباره بخون
            }
        }

        // اجرای اولیه هنگام باز شدن صفحه
        loadComments();
    </script>
</body>
</html>
